[workspace]
resolver = "3"
members = ["crates/cantcut-media", "crates/cantcut-timeline", "crates/cantcut-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cantcut-media = { path = "crates/cantcut-media" }
cantcut-timeline = { path = "crates/cantcut-timeline" }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
iced = { version = "0.14.0", features = ["advanced", "image-without-codecs", "tokio"] }
iced_runtime = "0.14.0"
memory-stats = "1"
rfd = "0.17"
serde_json = "1"

# FFmpeg does the heavy lifting natively, but the UI and wgpu are unusable unoptimised.
[profile.dev]
opt-level = 1
# Full debug info for the whole UI stack costs gigabytes of disk and slows linking.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
