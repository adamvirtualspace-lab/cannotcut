[workspace]
resolver = "3"
members = [
    "crates/cannotcut-media",
    "crates/cannotcut-timeline",
    "crates/cannotcut-audio",
    "crates/cannotcut-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cannotcut-audio = { path = "crates/cannotcut-audio" }
cannotcut-media = { path = "crates/cannotcut-media" }
cannotcut-timeline = { path = "crates/cannotcut-timeline" }
cpal = "0.18.2"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
iced = { version = "0.14.0", features = ["advanced", "image-without-codecs", "tokio"] }
iced_runtime = "0.14.0"
memory-stats = "1"
rfd = "0.17"
rtrb = "0.4.0"
serde_json = "1"

# FFmpeg does the heavy lifting natively, but the UI and wgpu are unusable unoptimised.
[profile.dev]
opt-level = 1
# Full debug info for the whole UI stack costs gigabytes of disk and slows linking.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
